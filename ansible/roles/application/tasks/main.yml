- name: Install dependencies
  ansible.builtin.apt:
    name:
      - git
      - nginx
      - curl
    state: present
    update_cache: true

- name: Install Node.js 20
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Create app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - /var/www/prism
    - /var/www/prism/frontend

- name: Clone frontend repository
  ansible.builtin.git:
    repo: "https://github.com/kofiae/prism-frontend.git"
    dest: /var/www/prism/frontend
    version: main
    force: true
  become_user: ubuntu
  when: not (molecule_test | default(false))

- name: Install frontend dependencies
  community.general.npm:
    path: /var/www/prism/frontend
    state: present
  become_user: ubuntu
  when: not (molecule_test | default(false))

- name: Build frontend
  ansible.builtin.command:
    cmd: npx vite build --outDir build
    chdir: /var/www/prism/frontend
  become_user: ubuntu
  when: not (molecule_test | default(false))

- name: Deploy Nginx config for app VM
  ansible.builtin.template:
    src: nginx-app.conf.j2
    dest: /etc/nginx/sites-available/prism
    mode: "0644"
  notify: Reload Nginx

- name: Enable app site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/prism
    dest: /etc/nginx/sites-enabled/prism
    state: link

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
