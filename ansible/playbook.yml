- name: Configure database
  hosts: database
  become: true
  roles:
    - database

- name: Deploy application
  hosts: app
  become: true
  roles:
    - application

- name: Configure load balancer
  hosts: loadbalancer
  become: true
  roles:
    - loadbalancer

- name: Configure backups
  hosts: database
  become: true
  roles:
    - backup

- name: Deploy CI tools
  hosts: citools
  become: true
  pre_tasks:
    - name: Create swap file
      ansible.builtin.command:
        cmd: fallocate -l 4G /swapfile
        creates: /swapfile

    - name: Set swap permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format swap
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: ansible_swaptotal_mb < 100

    - name: Enable swap
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: ansible_swaptotal_mb < 100

    - name: Persist swap in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
  roles:
    - jenkins
    - sonarqube
    - nexus
