---
- name: Install Java 8 and dependencies
  ansible.builtin.apt:
    name:
      - openjdk-8-jdk-headless
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Create nexus user
  ansible.builtin.user:
    name: "{{ nexus_user }}"
    system: true
    shell: /bin/bash
    create_home: false

- name: Download Nexus
  ansible.builtin.get_url:
    url: "https://download.sonatype.com/nexus/3/nexus-{{ nexus_version }}-unix.tar.gz"
    dest: /tmp/nexus.tar.gz
    mode: "0644"
  when: not (molecule_test | default(false))

- name: Extract Nexus
  ansible.builtin.unarchive:
    src: /tmp/nexus.tar.gz
    dest: /opt
    remote_src: true
    creates: "/opt/nexus-{{ nexus_version }}"
  when: not (molecule_test | default(false))

- name: Create symlink /opt/nexus
  ansible.builtin.file:
    src: "/opt/nexus-{{ nexus_version }}"
    dest: "{{ nexus_install_dir }}"
    state: link
  when: not (molecule_test | default(false))

- name: Set ownership of Nexus directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_user }}"
    recurse: true
  loop:
    - "/opt/nexus-{{ nexus_version }}"
    - "{{ nexus_data_dir }}"
  when: not (molecule_test | default(false))

- name: Configure Nexus to run as nexus user
  ansible.builtin.lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    regexp: '^#?run_as_user='
    line: 'run_as_user="{{ nexus_user }}"'
  when: not (molecule_test | default(false))

- name: Pin Java 8 in Nexus startup script
  ansible.builtin.lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#? *INSTALL4J_JAVA_HOME_OVERRIDE='
    line: "INSTALL4J_JAVA_HOME_OVERRIDE={{ nexus_java_home }}"
  notify: Restart Nexus
  when: not (molecule_test | default(false))

- name: Reduce JVM heap size
  ansible.builtin.lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}{{ item.value }}"
  loop:
    - { key: "-Xms", value: "{{ nexus_heap }}" }
    - { key: "-Xmx", value: "{{ nexus_heap }}" }
    - { key: "-XX:MaxDirectMemorySize=", value: "{{ nexus_direct_memory }}" }
  notify: Restart Nexus
  when: not (molecule_test | default(false))

- name: Deploy Nexus systemd service
  ansible.builtin.template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service
    mode: "0644"
  notify: Restart Nexus
  when: not (molecule_test | default(false))

- name: Enable and start Nexus
  ansible.builtin.systemd:
    name: nexus
    state: started
    enabled: true
    daemon_reload: true
  when: not (molecule_test | default(false))

- name: Wait for Nexus to be ready
  ansible.builtin.wait_for:
    port: "{{ nexus_port }}"
    delay: 30
    timeout: 600
  when: not (molecule_test | default(false))

- name: Deploy Nginx config for Nexus
  ansible.builtin.template:
    src: nginx-nexus.conf.j2
    dest: /etc/nginx/sites-available/nexus
    mode: "0644"
  notify: Reload Nginx

- name: Enable Nexus site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nexus
    dest: /etc/nginx/sites-enabled/nexus
    state: link

- name: Ensure Nginx is started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Configure HTTPS for Nexus
  ansible.builtin.command:
    cmd: >
      certbot --nginx -d {{ nexus_domain }}
      --non-interactive --agree-tos -m admin@sslip.io --redirect
  changed_when: true
  when: not (molecule_test | default(false))
